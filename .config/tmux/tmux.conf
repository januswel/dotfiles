# .tmux.conf
# janus_wel <janus.wel.3@gmail.com>

# server options
set-option -s copy-command pbcopy
set-option -s default-terminal tmux-256color
set-option -sa terminal-features 'xterm-256color:RGB'
# for Vim
set-option -s escape-time 10
set-option -s focus-events on

# options
# The left is just a padding
set-option -g status-left " "
# The right has load averages and datetime
set-option -g status-right "#[fg=black]#(sysctl -n vm.loadavg | tr -d '{}') #[fg=blue]%Y/%m/%d %H:%M"
# elder-friendly
set-option -g status-style fg=blue,bg=white
# for vimmer
set-option -g status-keys vi

set-option -g base-index 1
set-option -g renumber-windows on
set-option -g history-limit 50000

set-option -g pane-base-index 1
# for vimmer
set-option -g mode-keys vi
set-option -g automatic-rename off
# elder-friendly
set-option -g window-status-current-style fg=red,bg=black,bold,underscore

# keybinds
# disable last-window
unbind h
unbind l
bind-key h previous-window
bind-key l next-window

bind-key j select-pane -t :.+
bind-key k select-pane -t :.-

bind-key c new-window -n 'work' -c "#{pane_current_path}"
bind-key '"' split-window -c "#{pane_current_path}"
bind-key % split-window -h -c "#{pane_current_path}"

bind-key -r C-j resize-pane -D
bind-key -r C-k resize-pane -U
bind-key -r C-h resize-pane -L
bind-key -r C-l resize-pane -R

bind-key H select-layout even-horizontal
bind-key V select-layout even-vertical

bind-key R source-file ~/.config/tmux/tmux.conf \; display-message "sourced tmux.conf"

bind-key -T copy-mode-vi v send -X begin-selection
bind-key -T copy-mode-vi y send -X copy-pipe-and-cancel
unbind -T copy-mode-vi Enter
bind-key -T copy-mode-vi q send -X cancel
